name: 💡 Идея / улучшение
description: Предложение по улучшению источника или сайта
title: "[Идея] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Есть идея, как сделать GeraStore лучше? Расскажи!
  - type: textarea
    id: idea
    attributes:
      label: Твоя идея
      description: Что хочешь добавить или изменить?
      placeholder: Опиши идею...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем это нужно?
      placeholder: Как это улучшит источник / удобство?
  - type: dropdown
    id: area
    attributes:
      label: К чему относится
      options:
        - Сайт (index.html)
        - Источник (repo.json)
        - README / документация
        - Новые функции
        - Другое
  - type: textarea
    id: extra
    attributes:
      label: Дополнительно
      description: Макеты, примеры, ссылки — всё что поможет
